# Example inventory. Replace with your real hosts; keep the group structure.
all:
  children:
    web:
      hosts:
        web01.example.com:
          ansible_host: 10.0.1.11
        web02.example.com:
          ansible_host: 10.0.1.12
      vars:
        ansible_user: deploy
    db:
      hosts:
        db01.example.com:
          ansible_host: 10.0.2.11
        db02.example.com:
          ansible_host: 10.0.2.12
      vars:
        ansible_user: deploy
        # db hosts get tighter firewall rules via the hardening role
        hardening_firewall_allowed_tcp_ports: [22]
    bastion:
      hosts:
        bastion01.example.com:
          ansible_host: 10.0.0.10
      vars:
        ansible_user: deploy
  vars:
    ansible_python_interpreter: /usr/bin/python3
