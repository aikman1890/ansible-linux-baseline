# Ansible baseline configuration
[defaults]
# Inventory and roles relative to this file
inventory      = inventory/hosts.yml
roles_path     = roles

# Don't litter retry files on failed runs
retry_files_enabled = False

# Speed: skip fact gathering we don't use, pipeline module execution over SSH
gathering      = smart
fact_caching   = memory
pipelining     = True

# SSH hygiene
host_key_checking = True
timeout           = 30

# Output
stdout_callback  = default
display_skipped_hosts = False

# Privilege escalation: become root via sudo by default
[privilege_escalation]
become          = True
become_method   = sudo
become_user     = root
become_ask_pass = False

[ssh_connection]
# Reuse SSH connections aggressively
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30
